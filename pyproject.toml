# Tool configuration only. Dependencies live in requirements.txt / requirements-dev.txt
# so there is exactly one place to change them.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "T20"]
ignore = [
    "ANN401",  # allow Any where it is genuinely unconstrained
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.isort]
# Without this, `app` is treated as third-party and merged into the wrong block.
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]      # test functions do not need return annotations
"alembic/versions/*" = ["ANN", "E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Neither ships a py.typed marker. They are confined to app/services/pdf_pages.py, which
# wraps pypdfium2 behind a bytes-in/bytes-out function, and app/services/text_layer.py,
# which wraps both behind typed dataclasses. (pytesseract was here until the OCR path was
# removed on 2026-09-01.)
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database or LocalStack",
]
